[project]
name = "pcl-rustic"
version = "0.1.0"
description = "High-performance Python point cloud library backed by Rust and burn tensors"
readme = "README.md"
authors = [
    { name = "liuzhen19", email = "liuzhen19@xiaomi.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
]

[tool.maturin]
python-source = "python"
module-name = "pcl_rustic._core"
features = ["pyo3/extension-module"]

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/**/*.rs" },
    { file = "python/**/*.py" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "maturin>=1.9,<2.0",
    "ruff>=0.12",
]
docs = [
    "mkdocs-material>=9.5.0",
    "mkdocs-git-revision-date-localized-plugin>=1.2.0",
]
# Comparison-benchmark baselines. PCL itself is absent on purpose: it has no
# working Python binding on 3.12 (`python-pcl`'s newest release is a 2018
# cp27/cp35 alpha whose setup.py only knows PCL 1.7-1.9; `pclpy` pins
# ==3.6.*). The PCL baseline is the C++ harness in bench/pcl_cpp, driven from
# tests/test_benchmark_compare.py -- see `just bench-pcl`.
test = [
    "open3d>=0.19",
    "laspy[lazrs]>=2.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: marks tests that take a long time to run (large point clouds)",
    "bench: marks throughput/performance benchmark tests",
]


