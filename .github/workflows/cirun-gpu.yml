name: cirun-gpu

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  PYTHON_VERSION: "3.11"

jobs:
  # Run tests on custom GPU runner
  test:
    name: Test / ${{ matrix.platform.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: "cirun-gpu-ubuntu-runner--${{ github.run_id }}"
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      # The NVIDIA driver ships a Vulkan ICD (/etc/vulkan/icd.d/nvidia_icd.json)
      # but not the loader, and wgpu talks to the loader, not the ICD. Without
      # libvulkan1 the `vulkan` probe finds zero adapters, `default_device()`
      # degrades to `cpu` (by design, ADR-0001), and this whole job passes
      # while testing nothing GPU -- which is what it used to do.
      - name: Install Vulkan loader
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          add-job-id-key: "false"
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install just
        run: uv tool install rust-just

      - name: Install dependencies and build
        run: |
          uv sync --locked --all-extras --dev

      # Fail loudly if the GPU did not come up, instead of silently running
      # the suite on `cpu`. `device_report()` prints the adapter-enumeration
      # error, so a broken runner image is diagnosable from the log alone.
      - name: Assert GPU is selected
        run: |
          uv run python -c '
          import sys, pcl_rustic as p
          for name, status in p.device_report().items():
              print(f"{name}: {status}")
          default = p.default_device()
          print(f"default_device() -> {default}")
          if default == "cpu":
              sys.exit("FATAL: no GPU device on a GPU runner; see report above")
          '

      - name: Run tests
        run: |
          uv run pytest -m "not slow and not bench"

      - name: Upload coverage reports
        uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.11'
        with:
          files: ./coverage/coverage.xml
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
