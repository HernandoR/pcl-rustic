[package]
name = "pcl_rustic"
version = "0.1.0"
edition = "2021"
authors = ["liuzhen19 <liuzhen19@xiaomi.com>"]

[lib]
name = "_core"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]

[features]
default = []
cuda = ["burn/cuda"]
# See src/backend.rs for why `torch` also pulls in `burn-dispatch` directly:
# burn 0.21's `tch` feature does not forward to burn-dispatch's `tch` feature
# the way every other backend feature does. Fixed upstream in 0.22
# (burn/tch -> burn-core/tch -> burn-tensor/tch = burn-dispatch/tch), so drop
# `dep:burn-dispatch` when upgrading.
# No local PyTorch needed: burn-tch enables `tch/download-libtorch`, so
# torch-sys fetches the libtorch 2.9.0 it pins. Do NOT set
# LIBTORCH_USE_PYTORCH: it diverts the build to the active interpreter's torch
# and fails on any runner without a PyTorch 2.9.0 -- either "no cxx11 abi
# returned by python" when torch is absent, or C++ errors in libtch against a
# newer torch.
torch = ["burn/tch", "dep:burn-dispatch"]

[dependencies]
# Phantom dependency, only pulled in by the `torch` feature (see above and
# src/backend.rs): forces burn-dispatch's own `tch` feature on via Cargo
# feature unification with the `burn-dispatch` crate pulled in transitively
# by `burn`. Never referenced by name in code.
burn-dispatch = { version = "0.21", optional = true, default-features = false, features = [
    "tch",
] }

# File I/O (ADR-0004)
las = { version = "0.9.9", features = ["laz-parallel"] }
parquet = { version = "57", features = ["arrow"] }
arrow = "57"
csv = "1.3"

# NumPy / Python bindings
numpy = "0.27"
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py310"] }

# Error handling
thiserror = "2.0"

# Parallelism (voxel-index computation); seeded sampling (voxel downsampling)
rayon = "1.10"
rand = "0.9"
rand_chacha = "0.9"

# Unified runtime-dispatch tensor backend (ADR-0001). Two backends are always
# compiled in, and `src/backend.rs` picks between them at runtime:
#
# - `flex`, the pure-Rust CPU fallback. Not the CubeCL `burn/cpu` backend: that
#   one compiles cleanly but overflows the stack of an internal cubecl worker
#   thread on tall matmuls (a [N,3]x[3,3] f32 matmul aborts for N >= ~5.6M;
#   N = 5M is fine). Reproduces on burn 0.21.0 and 0.22.0-pre.2. Upstream:
#   tracel-ai/burn#5419, fixed by tracel-ai/burn#5423 (merged 2026-08-26).
#   We still keep `flex`: the fix is unreleased (newest is 0.22.0-pre.3, cut
#   2026-08-25, a day before the merge), and the repaired CPU path is ~3.4s on
#   the [10M,3] workload `flex` does in 0.22s. See src/backend.rs for the full
#   evaluation and the conditions for revisiting.
# - one wgpu flavour, chosen per target because burn-dispatch's `metal`,
#   `vulkan`, and `webgpu` features are mutually exclusive. Enabling two does
#   not fail the build: burn-dispatch's build.rs emits a `cargo:warning` and
#   then sets *none* of the `wgpu_*` cfgs, silently dropping every GPU backend
#   (burn-dispatch-0.21.0/build.rs:23-29). So the choice is made here, once per
#   target, and is deliberately not a cargo feature a caller could combine.
#
# macOS has no native Vulkan driver (only MoltenVK, which we do not ship), so
# Metal is the only GPU option there; Vulkan covers Linux and Windows.
[target.'cfg(target_os = "macos")'.dependencies]
burn = { version = "0.21", default-features = false, features = [
    "std",
    "dispatch",
    "flex",
    "metal",
] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
burn = { version = "0.21", default-features = false, features = [
    "std",
    "dispatch",
    "flex",
    "vulkan",
] }

# laz's GPS-time compressor relies on wrapping integer arithmetic and panics
# under debug overflow checks ("attempt to subtract with overflow" at
# laz-0.12.2/src/las/gps.rs:581, reproduced by writing .laz with spread-out
# gps_time values). Match its release semantics in dev builds until the
# upstream fix lands. Upstream: laz-rs/laz-rs#72.
[profile.dev.package.laz]
overflow-checks = false
