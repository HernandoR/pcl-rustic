[package]
name = "pcl_rustic"
version = "0.1.0"
edition = "2021"
authors = ["liuzhen19 <liuzhen19@xiaomi.com>"]

[lib]
name = "_core"
# "cdylib" is necessary to produce a shared library for Python to import from.
crate-type = ["cdylib"]

[features]
default = ["cpu", "vulkan"]
# Pure-Rust CPU backend (burn-flex). The CubeCL `burn/cpu` backend compiled
# fine but segfaults on large matmuls at runtime (reproduced: a [10M,3]x[3,3]
# f32 matmul crashes with SIGSEGV after ~300s; [5M,3] is fine) -- see
# src/backend.rs for the fallback rationale pinned in ADR-0001.
cpu = ["burn/flex"]
vulkan = ["burn/vulkan"]
cuda = ["burn/cuda"]
# See src/backend.rs for why `torch` also pulls in `burn-dispatch` directly:
# burn 0.21's own `tch` feature does not forward to burn-dispatch's `tch`
# feature the way every other backend feature does.
torch = ["burn/tch", "dep:burn-dispatch"]

[dependencies]
# Unified runtime-dispatch tensor backend (ADR-0001).
burn = { version = "0.21", default-features = false, features = ["std", "dispatch"] }
# Phantom dependency, only pulled in by the `torch` feature (see above and
# src/backend.rs): forces burn-dispatch's own `tch` feature on via Cargo
# feature unification with the `burn-dispatch` crate pulled in transitively
# by `burn`. Never referenced by name in code.
burn-dispatch = { version = "0.21", optional = true, default-features = false, features = [
    "tch",
] }

# File I/O (ADR-0004)
las = { version = "0.9.9", features = ["laz-parallel"] }
parquet = { version = "57", features = ["arrow"] }
arrow = "57"
csv = "1.3"

# NumPy / Python bindings
numpy = "0.27"
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py310"] }

# Error handling
thiserror = "2.0"

# Parallelism (voxel-index computation); seeded sampling (voxel downsampling)
rayon = "1.10"
rand = "0.9"
rand_chacha = "0.9"

# laz's GPS-time compressor relies on wrapping integer arithmetic and panics
# under debug overflow checks ("attempt to subtract with overflow" at
# laz-0.12.2/src/las/gps.rs:581, reproduced by writing .laz with spread-out
# gps_time values). Match its release semantics in dev builds until it is
# fixed upstream.
[profile.dev.package.laz]
overflow-checks = false
